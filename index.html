<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Du rudens pasauliai</title><style>:root{font-family:Arial,sans-serif;color:#17304b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:auto;padding:18px}.panel{background:white;border-radius:24px;padding:clamp(18px,4vw,35px);box-shadow:0 8px 35px #16325219;min-height:500px}h1{font-size:clamp(28px,5vw,42px);margin:10px 0}h2{font-size:clamp(24px,4vw,34px)}p{font-size:clamp(19px,2.8vw,23px);line-height:1.5}.eyebrow{color:#586b7e;font-weight:bold}.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px}.world{border-radius:20px;padding:25px 12px;text-align:center;font-size:clamp(20px,3vw,27px);font-weight:bold}.memory{background:#fff1c7}.fun{background:#eadbff}.emoji{font-size:clamp(48px,9vw,85px);display:block;margin-bottom:12px}.choices{display:grid;gap:13px;margin:24px 0}button{font:inherit;cursor:pointer;border:3px solid #c9d4df;border-radius:17px;padding:15px;background:#fff;color:#18314c;text-align:left;font-size:clamp(18px,2.7vw,23px);font-weight:bold;min-height:64px}button:hover,button:focus-visible{border-color:#2b67a0;outline:3px solid #99c9ed;outline-offset:2px}button.selected{border-color:#2d6b9b;background:#eaf5ff}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.primary{background:#174d80;color:white;border-color:#174d80;text-align:center}.secondary{background:#edf1f5;text-align:center}.primary:disabled{opacity:.5;cursor:not-allowed}.progress{height:15px;background:#dce6f0;border-radius:12px;overflow:hidden}.bar{height:100%;background:#e3a938;transition:width .2s}.feedback{padding:16px;border-radius:15px;background:#f0f6fa;font-size:20px;line-height:1.45}.good{background:#e4f4e8}.muted{color:#526579}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:15px}.hidden{display:none}.symbol{font-size:72px;text-align:center;padding:12px}.badge{font-size:19px;background:#f9e9bb;border-radius:30px;padding:8px 15px}footer{text-align:center;color:#637486;font-size:14px;padding:16px} @media(max-width:540px){.worlds{grid-template-columns:1fr}.panel{min-height:0}.actions button{flex:1}}</style></head><body><main><div class="top"><span class="eyebrow">PAŽINTINIS NUOTYKIS · 1–3 KLASĖMS</span><button id="reset" class="secondary small" style="font-size:15px;min-height:40px;padding:8px">Pradėti iš naujo</button></div><div class="progress" aria-label="Žaidimo pažanga"><div id="bar" class="bar"></div></div><p id="counter" class="muted small" aria-live="polite"></p><section class="panel" id="screen" aria-live="polite"></section><footer>Du rudens pasauliai · Vėlinės ir Helovinas</footer></main><script>
const tasks=[{"title":"Sumaišyti simboliai","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🕯️","question":"Kur dažnai uždegama atminimo žvakelė?","options":["Ant artimojo kapo","Ant šventinio torto","Ant moliūgo"],"answer":0,"hint":"Prisimink, kaip pagerbiame mirusius artimuosius.","why":"Per Vėlines uždegame žvakeles ant artimųjų kapų."},{"title":"Sumaišyti simboliai","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🎃","question":"Kuriai šventei būdingas moliūgo žibintas?","options":["Vėlinėms","Helovinui"],"answer":1,"hint":"Pagalvok apie persirengėlių šventę.","why":"Moliūgų žibintai būdingi Helovinui."},{"title":"Sumaišyti simboliai","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🌼","question":"Ką žmonės dažnai neša ant artimųjų kapų?","options":["Gėles","Kaukes","Saldainių maišus"],"answer":0,"hint":"Šis daiktas auga ir žydi.","why":"Gėlėmis žmonės pagerbia artimųjų atminimą."},{"title":"Paslaptingi daiktai","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🕯️","question":"Ką mums primena atminimo žvakelė?","options":["Mirusius artimuosius","Pokštų vakarėlį","Kostiumų konkursą"],"answer":0,"hint":"Pagalvok apie žmogų, kurio ilgiesi.","why":"Žvakelė gali būti atminimo ir pagarbos ženklas."},{"title":"Paslaptingi daiktai","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🎭","question":"Kam per Heloviną naudojama kaukė?","options":["Persirengti","Tvarkyti kapą","Uždegti žvakę"],"answer":0,"hint":"Kaukė keičia žmogaus išvaizdą.","why":"Per Heloviną žmonės mėgsta persirengti."},{"title":"Paslaptingi daiktai","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"📷","question":"Ką gali padėti prisiminti sena šeimos nuotrauka?","options":["Artimus žmones","Saldainių skonį","Orų prognozę"],"answer":0,"hint":"Kas yra vaizduojama šeimos nuotraukoje?","why":"Nuotraukos padeda išsaugoti prisiminimus."},{"title":"Kaip pasielgtum?","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🕯️","question":"Kapinėse žmonės tyliai prisimena artimuosius. Ką darysi?","options":["Kalbėsiu ramiai","Garsiai šauksiu","Bėgiosiu tarp kapų"],"answer":0,"hint":"Pagalvok apie kitų žmonių ramybę.","why":"Kapinėse gerbiame kitų žmonių ramybę."},{"title":"Kaip pasielgtum?","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🌷","question":"Pastebėjai nukritusią gėlę prie artimojo kapo. Ką darysi?","options":["Nuspirsiu toliau","Parsinešiu namo","Pakelsiu ir padėsiu atgal"],"answer":2,"hint":"Kaip gali pasirūpinti aplinka?","why":"Rūpestingas elgesys rodo pagarbą."},{"title":"Kaip pasielgtum?","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🎭","question":"Draugas nenori dalyvauti persirengėlių žaidime. Ką darysi?","options":["Gerbsiu jo sprendimą","Versiu jį žaisti","Juoksiuosi iš jo"],"answer":0,"hint":"Kiekvienas gali pasirinkti.","why":"Svarbu gerbti kito žmogaus pasirinkimą."},{"title":"Dvi rudens istorijos","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🕯️","question":"Šeima aplanko kapą ir uždega žvakelę. Apie kurią tradiciją kalbama?","options":["Vėlines","Heloviną"],"answer":0,"hint":"Šeima prisimena mirusį artimąjį.","why":"Tai būdinga Vėlinių minėjimui."},{"title":"Dvi rudens istorijos","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🎃","question":"Vaikai persirengia ir dalyvauja kostiumų šventėje. Kuri tai šventė?","options":["Vėlinės","Helovinas"],"answer":1,"hint":"Atkreipk dėmesį į kostiumus.","why":"Persirengėlių pramogos būdingos Helovinui."},{"title":"Dvi rudens istorijos","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"📖","question":"Senelė pasakoja apie mirusį prosenelį. Ką ji saugo?","options":["Prisiminimą","Pokštą","Kaukę"],"answer":0,"hint":"Pagalvok, kodėl pasakojame šeimos istorijas.","why":"Pasakojimai padeda išsaugoti artimųjų atminimą."},{"title":"Kas bendra, kas skiriasi?","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🍂","question":"Kas bendra Vėlinėms ir Helovinui?","options":["Abi šventės vyksta rudenį","Per abi renkame saldainius","Per abi dėvime kaukes"],"answer":0,"hint":"Prisimink metų laiką.","why":"Abi šventės vyksta rudenį."},{"title":"Kas bendra, kas skiriasi?","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🕯️","question":"Kas labiausiai būdinga Vėlinėms?","options":["Mirusių artimųjų prisiminimas","Kostiumų konkursas","Pokštų vakaras"],"answer":0,"hint":"Pagalvok apie atminimą ir pagarbą.","why":"Vėlinės skirtos mirusiųjų atminimui."},{"title":"Kas bendra, kas skiriasi?","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🎃","question":"Kas labiausiai būdinga Helovinui?","options":["Moliūgų žibintai","Kapų lankymas","Atminimo žvakelės ant kapų"],"answer":0,"hint":"Prisimink išskaptuotą moliūgą.","why":"Moliūgų žibintai – žinomas Helovino simbolis."},{"title":"Rudens kalendorius","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"📅","question":"Kada švenčiamas Helovinas?","options":["Spalio 31 d.","Lapkričio 2 d.","Gruodžio 24 d."],"answer":0,"hint":"Tai paskutinė spalio diena.","why":"Helovinas švenčiamas spalio 31 dieną."},{"title":"Rudens kalendorius","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"📅","question":"Kada Lietuvoje minima Visų Šventųjų diena?","options":["Lapkričio 1 d.","Spalio 31 d.","Lapkričio 10 d."],"answer":0,"hint":"Tai pirmoji lapkričio diena.","why":"Visų Šventųjų diena minima lapkričio 1 dieną."},{"title":"Rudens kalendorius","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"📅","question":"Kada minimos Vėlinės?","options":["Lapkričio 2 d.","Spalio 30 d.","Lapkričio 1 d."],"answer":0,"hint":"Tai diena po Visų Šventųjų dienos.","why":"Vėlinės minimos lapkričio 2 dieną."},{"title":"Atverk Rudens vartus","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🕯️","question":"Kodėl per Vėlines uždegame žvakeles?","options":["Pagerbiame mirusiųjų atminimą","Norime išgąsdinti kitus","Rengiame kostiumų šventę"],"answer":0,"hint":"Prisimink atminties pasaulį.","why":"Žvakelės primena mirusius artimuosius."},{"title":"Atverk Rudens vartus","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"❤️","question":"Kaip gali prisiminti mirusį artimąjį?","options":["Papasakoti apie jį","Užpūsti degančią žvakę","Paslėpti visas nuotraukas"],"answer":0,"hint":"Pagalvok apie gerus prisiminimus.","why":"Pasakojimai padeda išsaugoti atminimą."},{"title":"Atverk Rudens vartus","intro":"Pažvelk į simbolį ir pasirink atsakymą.","symbol":"🍂","question":"Ką sužinojai apie dvi rudens tradicijas?","options":["Jos vienodos","Jos skirtingos, abi galime gerbti","Jų tradicijas baigiame pamiršti"],"answer":1,"hint":"Prisimink abiejų pasaulių papročius.","why":"Svarbu pažinti tradicijas ir gerbti žmonių pasirinkimus."}];
let state={step:-1,selected:null,done:false,hint:false};try{const saved=JSON.parse(localStorage.getItem('rudens_pasauliai_v3'));if(saved&&Number.isInteger(saved.step)&&saved.step>=-1&&saved.step<=tasks.length)state={...state,...saved}}catch(e){};
const screen=document.getElementById('screen');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('rudens_pasauliai_v3',JSON.stringify(state))}function render(){const progress=Math.max(0,Math.min(state.step,tasks.length));document.getElementById('bar').style.width=(progress/tasks.length*100)+'%';document.getElementById('counter').textContent=state.step<0?'Kelionė dar neprasidėjo':state.step>=tasks.length?'Visos stotelės įveiktos!':`Stotelė ${Math.floor(state.step/3)+1} iš 7 · Klausimas ${state.step%3+1} iš 3`;if(state.step===-1){screen.innerHTML=`<h1>Du rudens pasauliai</h1><p>Rudens vėjas sumaišė dviejų pasaulių daiktus. Padėk juos sugrąžinti!</p><div class="worlds"><div class="world memory"><span class="emoji">🕯️🍂</span>Atminties pasaulis<p>Vėlinės</p></div><div class="world fun"><span class="emoji">🎃🎭</span>Pokštų pasaulis<p>Helovinas</p></div></div><p>Įveik 7 stoteles ir atsakyk į 21 klausimą. Atrask tradicijų skirtumus.</p><div class="actions"><button class="primary" id="start">Pradėti kelionę →</button></div>`;document.getElementById('start').onclick=()=>{state={step:0,selected:null,done:false,hint:false};save();render()};return}if(state.step===tasks.length){screen.innerHTML=`<div class="symbol">✨🕯️✨</div><h1>Rudens vartai atverti!</h1><p>Tu atsakei į 21 klausimą ir pažinai du rudens pasaulius.</p><div class="worlds"><div class="world memory">🕯️<p>Per Vėlines prisimename mirusius artimuosius.</p></div><div class="world fun">🎃<p>Per Heloviną žmonės persirengia ir pramogauja.</p></div></div><p><strong>Tradicijos skirtingos. Svarbu jas pažinti ir gerbti.</strong></p><div class="actions"><button class="primary" id="again">Žaisti dar kartą</button></div>`;document.getElementById('again').onclick=restart;return}const t=tasks[state.step];screen.innerHTML=`<div class="badge">${Math.floor(state.step/3)+1} / 7 · ${escapeHtml(t.title)} · ${state.step%3+1} klausimas</div><div class="symbol" aria-hidden="true">${t.symbol}</div><p>${escapeHtml(t.intro)}</p><h2>${escapeHtml(t.question)}</h2><div class="choices">${t.options.map((o,i)=>`<button data-choice="${i}" class="${state.selected===i?'selected':''}" aria-pressed="${state.selected===i}">${escapeHtml(o)}</button>`).join('')}</div>${state.hint?`<div class="feedback">💡 ${escapeHtml(t.hint)}</div>`:''}${state.done?`<div class="feedback good"><strong>Teisingai!</strong> ${escapeHtml(t.why)}</div>`:state.selected!==null&&state.wrong?`<div class="feedback">Dar ne. Pasirink kitą atsakymą ir spausk „Patikrinti“.</div>`:''}<div class="actions">${!state.done?`<button class="secondary" id="hint">💡 Pagalba</button><button class="primary" id="check" ${state.selected===null?'disabled':''}>Patikrinti</button>`:`<button class="primary" id="next">${state.step===tasks.length-1?'Atverti vartus →':'Toliau →'}</button>`}</div>`;screen.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(state.done)return;state.selected=Number(b.dataset.choice);state.wrong=false;save();render()});const hint=document.getElementById('hint');if(hint)hint.onclick=()=>{state.hint=true;save();render()};const check=document.getElementById('check');if(check)check.onclick=()=>{if(state.selected===t.answer){state.done=true;state.wrong=false}else{state.wrong=true}save();render()};const next=document.getElementById('next');if(next)next.onclick=()=>{state.step++;state.selected=null;state.done=false;state.hint=false;state.wrong=false;save();render()}}function restart(){state={step:-1,selected:null,done:false,hint:false};save();render()}document.getElementById('reset').onclick=restart;render();
</script></body></html>
